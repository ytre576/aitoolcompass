<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">AI research workflow stack</title>
  <desc id="desc">A step-by-step research workflow using search, source review, notes, and final synthesis.</desc>
  <rect width="900" height="520" rx="28" fill="#f9f0df"/>
  <g stroke="#10251f" stroke-width="4" fill="#fffdf7">
    <rect x="98" y="92" width="704" height="76" rx="18"/>
    <rect x="98" y="202" width="704" height="76" rx="18"/>
    <rect x="98" y="312" width="704" height="76" rx="18"/>
  </g>
  <g font-family="Georgia, serif" fill="#10251f">
    <text x="126" y="143" font-size="30">Question → Perplexity → Sources</text>
    <text x="126" y="253" font-size="30">Fetch → Compare → Notes</text>
    <text x="126" y="363" font-size="30">Synthesis → Brief → Publish</text>
  </g>
  <g fill="#1f7a8c" stroke="#10251f" stroke-width="3">
    <circle cx="742" cy="130" r="26"/><circle cx="742" cy="240" r="26"/><circle cx="742" cy="350" r="26"/>
  </g>
  <g fill="#fffdf7" font-family="Verdana, sans-serif" font-size="20" font-weight="700">
    <text x="735" y="137">1</text><text x="735" y="247">2</text><text x="735" y="357">3</text>
  </g>
</svg>
